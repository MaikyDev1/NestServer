devices:
  bedroom_sensor:
    actions:
      get_state:
        type: "http"
        url: "http://10.0.0.200/api/v1/sensor/read"
        response:
          mode: forward
        params:
          number: "1"
  leds:
    actions:
      turn_on:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/leds/1"
        response:
          mode: forward
      turn_off:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/leds/0"
        response:
          mode: forward
      turn:
        type: "http"
        url: "http://10.0.0.200/api/v1/switch/balcony/set"
        response:
          mode: forward
      get_state:
        type: "http"
        url: "http://10.0.0.200/api/v2/get/control/leds"
        response:
          mode: forward
  bulbs:
    actions:
      turn_on:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/bulbs/1"
        response:
          mode: forward
      turn_off:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/bulbs/0"
        response:
          mode: forward
      get_state:
        type: "http"
        url: "http://10.0.0.200/api/v2/get/control/bulbs"
        response:
          mode: forward
  wall:
    actions:
      turn_on:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/wall/1"
        response:
          mode: forward
      turn_off:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/wall/0"
        response:
          mode: forward
      get_state:
        type: "http"
        url: "http://10.0.0.200/api/v2/get/control/wall"
        response:
          mode: forward
  heating:
    actions:
      turn_on:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/start_heating/120"
        response:
          mode: forward
        params:
          time: "%time%"
      add_time:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/heating_add_time/30"
        response:
          mode: forward
        params:
          time: "%time%"
      remove_time:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/heating_remove_time/30"
        response:
          mode: forward
        params:
          time: "%time%"
      turn_off:
        type: "http"
        url: "http://10.0.0.200/api/v2/update/control/stop_heating"
        response:
          mode: forward
      get_state:
        type: "http"
        url: "http://10.0.0.200/api/v2/get/control/heating_time"
        response:
          mode: forward
  apple_tv_remote:
    actions:
      menu:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/appletv/menu"
      left:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/appletv/left"
      right:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/appletv/right"
      down:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/appletv/down"
      up:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/appletv/up"
      "ok":
        type: "http"
        url: "http://10.0.0.203:8080/noconf/appletv/ok"
      pause:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/appletv/pause"
  soundbar_remote:
    actions:
      volume_up:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/soundbar/volume_up"
      volume_down:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/soundbar/volume_down"
      woofer_up:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/soundbar/woofer_up"
      woofer_down:
        type: "http"
        url: "http://10.0.0.203:8080/noconf/soundbar/woofer_down"